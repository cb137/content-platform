[project]
name = "content-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "cb137", email = "cfbarret@andrew.cmu.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.7.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "openai>=3.48.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "tenacity>=9.2.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
content-api = "content_api:main"
post-stats = "content_api.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
]

[tool.ruff.lint.isort]
known-first-party = ["content_api"]

[tool.pytest.ini_options]
# Tests marked "integration" call real AI services and cost money, so normal
# runs skip them. Run them on purpose with: uv run pytest -m integration
addopts = "-m 'not integration'"
markers = [
    "integration: calls the real AI API and costs money",
]
